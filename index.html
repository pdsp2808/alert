<!DOCTYPE html>
<html lang="de" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LU-Alert Monitor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { 
    extend: { 
      colors: { 
        brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 900: '#14532d' } 
      } 
    } 
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
</style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">
<!-- Header & Navigation - Über den ganzen Bildschirm -->
<header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-30 shadow-sm w-full">
<div class="w-full px-4 sm:px-6 lg:px-8">
<div class="flex items-center justify-between h-16">
<!-- Ganz links -->
<div class="flex items-center space-x-3">
<div onclick="triggerManualRefresh()" class="p-2 bg-blue-600 text-white rounded-lg shadow cursor-pointer hover:bg-blue-700 transition-colors" title="Seite aktualisieren">
<i data-lucide="triangle-alert" class="w-6 h-6"></i>
</div>
<div>
<!-- Schriftgröße responsiv angepasst (text-base auf Handy, text-lg ab sm), damit es einzeilig bleibt -->
<h1 class="text-base sm:text-lg font-bold leading-none text-gray-900 dark:text-white whitespace-nowrap">LU-Alert Monitor</h1>
<div class="text-xs text-gray-500 dark:text-gray-400 mt-1 flex flex-col sm:flex-row sm:items-center sm:space-x-1.5">
<a href="https://www.cisreisdorf.lu" target="_blank" rel="noopener noreferrer" class="hover:underline font-medium text-gray-700 dark:text-gray-300">CIS Reisdorf</a>
<span class="hidden sm:inline">&bull;</span>
<a href="https://www.lu-alert.lu" target="_blank" rel="noopener noreferrer" class="hover:underline">Quelle: lu-alert.lu</a>
</div>
</div>
</div>
<!-- Ganz rechts: Sprache -> Stand -> Aktualisieren -> Theme -->
<div class="flex items-center space-x-3">
<select id="lang-select" onchange="setLanguage(this.value)" class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 border border-gray-200 dark:border-gray-700 rounded-lg px-2 py-1 text-xs font-semibold focus:outline-none">
<option value="de" selected>DE</option>
<option value="fr">FR</option>
<option value="en">EN</option>
</select>
<div class="flex flex-col text-right">
<span class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Stand</span>
<span id="last-update-time" class="text-xs font-mono font-medium text-gray-700 dark:text-gray-300">--:--</span>
</div>
<button onclick="triggerManualRefresh()" title="Daten jetzt aktualisieren" class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">
<span id="refresh-wrapper" class="inline-flex items-center justify-center">
<i data-lucide="refresh-cw" class="w-5 h-5"></i>
</span>
</button>
<button id="theme-toggle" onclick="toggleTheme()" title="Design umschalten" class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">
<i id="theme-icon-sun" data-lucide="sun" class="w-5 h-5 hidden"></i>
<i id="theme-icon-moon" data-lucide="moon" class="w-5 h-5"></i>
</button>
</div>
</div>
</div>
</header>
<main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
<!-- Modernes Wetter Widget -->
<div class="bg-gradient-to-br from-white to-gray-50 dark:from-gray-800 dark:to-gray-850 border border-gray-200 dark:border-gray-700 rounded-xl p-5 shadow-sm">
<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
<div class="flex items-center space-x-4">
<div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl p-2.5 shadow-sm flex items-center justify-center">
<span id="w-icon" class="text-3xl leading-none"> </span>
</div>
<div>
<div class="flex items-baseline space-x-2">
<span id="w-temp" class="text-2xl font-extrabold text-gray-900 dark:text-white">-- °C</span>
<span id="w-status" class="text-sm font-semibold text-gray-500 dark:text-gray-400">Lade...</span>
</div>
<div class="mt-1">
<select id="location-select" onchange="handleLocationChange()" class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200 border border-gray-200 dark:border-gray-700 rounded-md px-2 py-1 text-xs font-semibold focus:outline-none">
<!-- Wird dynamisch gefüllt -->
</select>
</div>
</div>
</div>
<div class="flex items-center space-x-4 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 px-4 py-2.5 rounded-lg text-xs shadow-sm">
<div>
<span id="w-wind-label" class="text-[10px] uppercase text-gray-400 font-semibold block">Wind</span>
<strong id="w-wind" class="text-gray-900 dark:text-white">-- km/h</strong>
</div>
<div class="border-l border-gray-200 dark:border-gray-700 pl-4">
<span id="w-hum-label" class="text-[10px] uppercase text-gray-400 font-semibold block">Feuchtigkeit</span>
<strong id="w-hum" class="text-gray-900 dark:text-white">--%</strong>
</div>
</div>
</div>
<div class="mt-4 pt-3 border-t border-gray-200 dark:border-gray-700 flex items-center space-x-2">
<span id="forecast-label" class="text-xs font-semibold text-gray-500 dark:text-gray-400">Prognose:</span>
<button id="btn-hourly" onclick="toggleForecast('hourly')" class="px-3 py-1 rounded-md text-xs font-semibold border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-300 hover:border-blue-500">Stunden</button>
<button id="btn-daily" onclick="toggleForecast('daily')" class="px-3 py-1 rounded-md text-xs font-semibold border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-300 hover:border-blue-500">Tage</button>
</div>
<div id="forecast-container" class="hidden mt-3 flex gap-2 overflow-x-auto pb-1"></div>
</div>
<!-- Nahtlos verbundene Legende (Behoben: dark:hover:bg-gray-700 hinzugefügt, damit es dunkel bleibt) -->
<div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden shadow-sm">
<button onclick="toggleLegend()" class="w-full px-4 py-3 text-xs font-semibold text-gray-800 dark:text-gray-200 flex justify-between items-center bg-transparent hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
<span id="legend-btn-text"> Warnstufen-Legende anzeigen</span>
<span id="legend-icon">▼</span>
</button>
<div id="legend-content" class="hidden px-4 pb-4 border-t border-gray-200 dark:border-gray-700 text-xs bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200">
<table class="w-full border-collapse mt-2">
<thead>
<tr class="text-gray-400 uppercase text-[10px] border-b border-gray-200 dark:border-gray-700">
<th class="py-2 text-left">Stufe</th>
<th id="th-desc" class="py-2 text-left">Beschreibung</th>
</tr>
</thead>
<tbody class="divide-y divide-gray-100 dark:divide-gray-700">
<tr><td class="py-2"><span class="px-2 py-0.5 rounded bg-purple-600 text-white font-bold">D</span></td><td class="py-2"><strong id="leg-d-title"></strong><span id="leg-d-sub" class="block text-[11px] text-gray-400"></span></td></tr>
<tr><td class="py-2"><span id="badge-n1" class="px-2 py-0.5 rounded bg-red-600 text-white font-bold">N1</span></td><td class="py-2"><strong id="leg-n1-title"></strong><span id="leg-n1-sub" class="block text-[11px] text-gray-400"></span></td></tr>
<tr><td class="py-2"><span id="badge-n2" class="px-2 py-0.5 rounded bg-orange-600 text-white font-bold">N2</span></td><td class="py-2"><strong id="leg-n2-title"></strong><span id="leg-n2-sub" class="block text-[11px] text-gray-400"></span></td></tr>
<tr><td class="py-2"><span id="badge-n3" class="px-2 py-0.5 rounded bg-yellow-600 text-white font-bold">N3</span></td><td class="py-2"><strong id="leg-n3-title"></strong><span id="leg-n3-sub" class="block text-[11px] text-gray-400"></span></td></tr>
<tr><td class="py-2"><span class="px-2 py-0.5 rounded bg-orange-500 text-white font-bold">A</span></td><td class="py-2"><strong id="leg-a-title"></strong><span id="leg-a-sub" class="block text-[11px] text-gray-400"></span></td></tr>
<tr><td class="py-2"><span class="px-2 py-0.5 rounded bg-lime-600 text-white font-bold">I</span></td><td class="py-2"><strong id="leg-i-title"></strong><span id="leg-i-sub" class="block text-[11px] text-gray-400"></span></td></tr>
<tr><td class="py-2"><span class="px-2 py-0.5 rounded bg-gray-600 text-white font-bold">T</span></td><td class="py-2"><strong id="leg-t-title"></strong><span id="leg-t-sub" class="block text-[11px] text-gray-400"></span></td></tr>
</tbody>
</table>
</div>
</div>
<!-- Primäre Notfallmeldungen -->
<div id="primary-alerts" class="space-y-4"></div>
<!-- Lebensmittelrückrufe Akkordeon -->
<div id="food-section" class="space-y-2" style="display: none;">
<button onclick="toggleAccordion()" class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 px-4 py-3 rounded-xl text-xs font-semibold flex justify-between items-center shadow-sm">
<span id="food-accordion-label">Lebensmittel- & Produktrückrufe</span>
<span id="accordion-icon">▼</span>
</button>
<div id="food-alerts-container" class="hidden space-y-4 pt-2"></div>
</div>
</main>
<script>
const WORKER_URL = "https://lu-alert-proxy.patrick95tuga.workers.dev/";
let currentLang = "de";
let rawXmlData = null;
let currentLat = 49.85;
let currentLon = 6.27;
let activeForecastMode = null;
let cachedWeatherData = null;

const COMMUNE_DATA = {
  "Reisdorf": { lat: 49.85, lon: 6.27 },
  "Luxemburg": { lat: 49.61, lon: 6.13 },
  "Esch-sur-Alzette": { lat: 49.49, lon: 5.98 },
  "Differdange": { lat: 49.52, lon: 5.89 },
  "Dudelange": { lat: 49.48, lon: 6.08 },
  "Ettelbruck": { lat: 49.84, lon: 6.09 },
  "Diekirch": { lat: 49.86, lon: 6.15 },
  "Echternach": { lat: 49.80, lon: 6.34 },
  "Grevenmacher": { lat: 49.68, lon: 6.44 },
  "Remich": { lat: 49.54, lon: 6.36 },
  "Wiltz": { lat: 49.96, lon: 5.93 },
  "Clervaux": { lat: 50.05, lon: 6.03 },
  "Vianden": { lat: 49.93, lon: 6.20 },
  "Mersch": { lat: 49.75, lon: 6.10 },
  "Redange": { lat: 49.75, lon: 5.89 },
  "Capellen": { lat: 49.64, lon: 6.00 }
};

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initLocationSelect();
  lucide.createIcons();
  updateTexts();
  loadWeather(currentLat, currentLon);
  loadAlerts();
});

function initLocationSelect() {
  const select = document.getElementById("location-select");
  if (!select) return;
  select.innerHTML = "";
  for (const [name, coords] of Object.entries(COMMUNE_DATA)) {
    const option = document.createElement("option");
    option.value = `${coords.lat},${coords.lon}`;
    option.textContent = name;
    if (name === "Reisdorf") option.selected = true;
    select.appendChild(option);
  }
}

function initTheme() {
  const savedTheme = localStorage.getItem('theme');
  let isDark = false;
  if (savedTheme) {
    isDark = (savedTheme === 'dark');
  } else {
    const currentHour = new Date().getHours();
    isDark = (currentHour >= 22 || currentHour < 6);
  }
  applyTheme(isDark);
}

function applyTheme(isDark) {
  if (isDark) {
    document.documentElement.classList.add('dark');
    document.documentElement.classList.remove('light');
    document.getElementById('theme-icon-sun').classList.remove('hidden');
    document.getElementById('theme-icon-moon').classList.add('hidden');
  } else {
    document.documentElement.classList.remove('dark');
    document.documentElement.classList.add('light');
    document.getElementById('theme-icon-sun').classList.add('hidden');
    document.getElementById('theme-icon-moon').classList.remove('hidden');
  }
}

function toggleTheme() {
  const isDark = !document.documentElement.classList.contains('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  applyTheme(isDark);
}

async function triggerManualRefresh() {
  const refreshWrapper = document.getElementById('refresh-wrapper');
  if (refreshWrapper) refreshWrapper.classList.add('animate-spin');
  await Promise.all([loadAlerts(), loadWeather(currentLat, currentLon)]);
  setTimeout(() => {
    if (refreshWrapper) refreshWrapper.classList.remove('animate-spin');
  }, 500);
}

function toggleLegend() {
  const content = document.getElementById("legend-content");
  const icon = document.getElementById("legend-icon");
  const btnText = document.getElementById("legend-btn-text");
  content.classList.toggle("hidden");
  const isOpen = !content.classList.contains("hidden");
  icon.textContent = isOpen ? "▲" : "▼";
  if (currentLang === 'de') {
    btnText.textContent = isOpen ? " Warnstufen-Legende ausblenden" : " Warnstufen-Legende anzeigen";
  } else if (currentLang === 'fr') {
    btnText.textContent = isOpen ? " Masquer la légende des alertes" : " Afficher la légende des alertes";
  } else {
    btnText.textContent = isOpen ? " Hide alert legend" : " Show alert legend";
  }
}

function toggleAccordion() {
  const content = document.getElementById("food-alerts-container");
  const icon = document.getElementById("accordion-icon");
  content.classList.toggle("hidden");
  icon.textContent = content.classList.contains("hidden") ? "▼" : "▲";
}

function setLanguage(lang) {
  currentLang = lang;
  document.getElementById("lang-select").value = lang;
  updateTexts();
  loadWeather(currentLat, currentLon);
  if (rawXmlData) renderAlerts(rawXmlData);
}

function updateTexts() {
  const btnText = document.getElementById("legend-btn-text");
  const isClosed = document.getElementById("legend-content").classList.contains("hidden");
  const prefix = currentLang === 'de' ? 'S' : currentLang === 'en' ? 'L' : 'N';
  document.getElementById("badge-n1").textContent = prefix + '1';
  document.getElementById("badge-n2").textContent = prefix + '2';
  document.getElementById("badge-n3").textContent = prefix + '3';
  document.getElementById("th-desc").textContent = currentLang === 'de' ? 'Beschreibung' : 'Description';
  document.getElementById("w-hum-label").textContent = currentLang === 'de' ? 'Feuchtigkeit' : currentLang === 'fr' ? 'Humidité' : 'Humidity';
  document.getElementById("forecast-label").textContent = currentLang === 'de' ? 'Prognose:' : currentLang === 'fr' ? 'Prévision:' : 'Forecast :';
  document.getElementById("btn-hourly").textContent = currentLang === 'de' ? 'Stunden' : currentLang === 'fr' ? 'Heures' : 'Hourly';
  document.getElementById("btn-daily").textContent = currentLang === 'de' ? 'Tage' : currentLang === 'fr' ? 'Jours' : 'Daily';
  if (currentLang === 'de') {
    btnText.textContent = isClosed ? " Warnstufen-Legende anzeigen" : " Warnstufen-Legende ausblenden";
    document.getElementById("leg-d-title").textContent = "Akute Gefahr / Sofortiges Handeln";
    document.getElementById("leg-d-sub").textContent = "Warnung die sofortiges Handeln erfordert";
    document.getElementById("leg-n1-title").textContent = "Wachsamkeitsstufe rot / Äußerste Vorsicht";
    document.getElementById("leg-n1-sub").textContent = "Die höchste Warnstufe";
    document.getElementById("leg-n2-title").textContent = "Wachsamkeitsstufe orange / Seien Sie vorsichtig";
    document.getElementById("leg-n2-sub").textContent = "Die mittlere Warnstufe";
    document.getElementById("leg-n3-title").textContent = "Wachsamkeitsstufe gelb / Seien Sie aufmerksam";
    document.getElementById("leg-n3-sub").textContent = "Die niedrigste Warnstufe";
    document.getElementById("leg-a-title").textContent = "Vermissten- / Entführungsmeldung";
    document.getElementById("leg-a-sub").textContent = "Warnung bei Vermissten-/Entführungssituationen";
    document.getElementById("leg-i-title").textContent = "Information (kein Risiko)";
    document.getElementById("leg-i-sub").textContent = "Für Informationsmeldungen";
    document.getElementById("leg-t-title").textContent = "Test (kein Risiko)";
    document.getElementById("leg-t-sub").textContent = "Für Test- und Übungszwecke";
  } else if (currentLang === 'fr') {
    btnText.textContent = isClosed ? " Afficher la légende des alertes" : " Masquer la légende des alertes";
    document.getElementById("leg-d-title").textContent = "Danger imminent / Action immédiate";
    document.getElementById("leg-d-sub").textContent = "Alerte nécessitant une action immédiate";
    document.getElementById("leg-n1-title").textContent = "Niveau de vigilance rouge";
    document.getElementById("leg-n1-sub").textContent = "Le niveau d'alerte le plus élevé";
    document.getElementById("leg-n2-title").textContent = "Niveau de vigilance orange";
    document.getElementById("leg-n2-sub").textContent = "Le niveau d'alerte moyen";
    document.getElementById("leg-n3-title").textContent = "Niveau de vigilance jaune";
    document.getElementById("leg-n3-sub").textContent = "Le niveau d'alerte le plus bas";
    document.getElementById("leg-a-title").textContent = "Disparition / enlèvement";
    document.getElementById("leg-a-sub").textContent = "Utilisé pour des alertes de disparition";
    document.getElementById("leg-i-title").textContent = "Information";
    document.getElementById("leg-i-sub").textContent = "Utilisé pour des messages d'information";
    document.getElementById("leg-t-title").textContent = "Test";
    document.getElementById("leg-t-sub").textContent = "Utilisé pour des messages de test";
  } else {
    btnText.textContent = isClosed ? " Show alert legend" : " Hide alert legend";
    document.getElementById("leg-d-title").textContent = "Imminent danger / Immediate action";
    document.getElementById("leg-d-sub").textContent = "Alert requiring immediate action";
    document.getElementById("leg-n1-title").textContent = "Awareness level red";
    document.getElementById("leg-n1-sub").textContent = "The highest alert level";
    document.getElementById("leg-n2-title").textContent = "Awareness level orange";
    document.getElementById("leg-n2-sub").textContent = "The medium alert level";
    document.getElementById("leg-n3-title").textContent = "Awareness level yellow";
    document.getElementById("leg-n3-sub").textContent = "The lowest alert level";
    document.getElementById("leg-a-title").textContent = "Missing person / kidnapping";
    document.getElementById("leg-a-sub").textContent = "Used for missing person alerts";
    document.getElementById("leg-i-title").textContent = "Information";
    document.getElementById("leg-i-sub").textContent = "Used for information messages";
    document.getElementById("leg-t-title").textContent = "Test";
    document.getElementById("leg-t-sub").textContent = "Used for test messages";
  }
}

function handleLocationChange() {
  const select = document.getElementById("location-select");
  const [lat, lon] = select.value.split(',');
  currentLat = parseFloat(lat);
  currentLon = parseFloat(lon);
  loadWeather(currentLat, currentLon);
}

function getWeatherDetails(code) {
  let desc = "Klar";
  let icon = "☀️";
  if (code >= 1 && code <= 3) { desc = currentLang === 'de' ? 'Bewölkt' : currentLang === 'fr' ? 'Nuageux' : 'Cloudy'; icon = "☁️"; }
  else if (code >= 45 && code <= 48) { desc = currentLang === 'de' ? 'Nebel' : currentLang === 'fr' ? 'Brouillard' : 'Foggy'; icon = "🌫️"; }
  else if (code >= 51 && code <= 67) { desc = currentLang === 'de' ? 'Regen' : currentLang === 'fr' ? 'Pluie' : 'Rain'; icon = "🌧️"; }
  else if (code >= 71 && code <= 77) { desc = currentLang === 'de' ? 'Schnee' : currentLang === 'fr' ? 'Neige' : 'Snow'; icon = "❄️"; }
  else if (code >= 95) { desc = currentLang === 'de' ? 'Gewitter' : currentLang === 'fr' ? 'Orage' : 'Thunderstorm'; icon = "⛈️"; }
  return { desc, icon };
}

async function loadWeather(lat, lon) {
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`);
    cachedWeatherData = await res.json();
    const current = cachedWeatherData.current;
    document.getElementById("w-temp").textContent = current.temperature_2m + " °C";
    document.getElementById("w-wind").textContent = current.wind_speed_10m + " km/h";
    document.getElementById("w-hum").textContent = current.relative_humidity_2m + "%";
    document.getElementById("w-wind-label").textContent = currentLang === 'de' ? 'Wind' : currentLang === 'fr' ? 'Vent' : 'Wind';
    const details = getWeatherDetails(current.weather_code);
    document.getElementById("w-status").textContent = details.desc;
    document.getElementById("w-icon").textContent = details.icon;
    if (activeForecastMode) renderForecast();
  } catch (e) {
    document.getElementById("w-status").textContent = "Nicht verfügbar";
  }
}

function toggleForecast(mode) {
  const container = document.getElementById("forecast-container");
  const btnHourly = document.getElementById("btn-hourly");
  const btnDaily = document.getElementById("btn-daily");
  if (activeForecastMode === mode) {
    activeForecastMode = null;
    container.classList.add("hidden");
    btnHourly.classList.remove("border-blue-500", "text-blue-600");
    btnDaily.classList.remove("border-blue-500", "text-blue-600");
  } else {
    activeForecastMode = mode;
    container.classList.remove("hidden");
    btnHourly.classList.toggle("border-blue-500", mode === 'hourly');
    btnDaily.classList.toggle("border-blue-500", mode === 'daily');
    renderForecast();
  }
}

function renderForecast() {
  if (!cachedWeatherData) return;
  const container = document.getElementById("forecast-container");
  container.innerHTML = "";
  if (activeForecastMode === 'hourly') {
    const hourly = cachedWeatherData.hourly;
    const currentHour = new Date().getHours();
    for (let i = currentHour + 1; i <= currentHour + 6; i++) {
      if (!hourly.time[i]) break;
      const timeStr = hourly.time[i].split("T")[1].substring(0, 5);
      const temp = Math.round(hourly.temperature_2m[i]);
      const details = getWeatherDetails(hourly.weather_code[i]);
      container.innerHTML += `
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-2 text-center min-w-[75px] shrink-0 text-xs">
          <div class="font-bold text-gray-400">${timeStr}</div>
          <div class="text-lg my-1">${details.icon}</div>
          <div class="font-bold text-gray-900 dark:text-white">${temp}°C</div>
        </div>`;
    }
  } else if (activeForecastMode === 'daily') {
    const daily = cachedWeatherData.daily;
    for (let i = 1; i <= 3; i++) {
      if (!daily.time[i]) break;
      const dateObj = new Date(daily.time[i]);
      const dayName = dateObj.toLocaleDateString(currentLang === 'de' ? 'de-DE' : currentLang === 'fr' ? 'fr-FR' : 'en-US', { weekday: 'short' });
      const maxTemp = Math.round(daily.temperature_2m_max[i]);
      const minTemp = Math.round(daily.temperature_2m_min[i]);
      const details = getWeatherDetails(daily.weather_code[i]);
      container.innerHTML += `
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-2 text-center min-w-[75px] shrink-0 text-xs">
          <div class="font-bold text-gray-400">${dayName}</div>
          <div class="text-lg my-1">${details.icon}</div>
          <div class="font-bold text-gray-900 dark:text-white">${maxTemp}° / ${minTemp}°</div>
        </div>`;
    }
  }
}

async function loadAlerts() {
  const primaryContainer = document.getElementById('primary-alerts');
  const timeBadge = document.getElementById('last-update-time');
  try {
    const response = await fetch(WORKER_URL);
    if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
    const data = await response.json();
    if (data.error) throw new Error(data.error);
    rawXmlData = data.raw_xml;
    renderAlerts(rawXmlData);
    const now = new Date();
    timeBadge.textContent = now.toLocaleTimeString("de-DE", { hour: '2-digit', minute: '2-digit', hour12: false });
  } catch (err) {
    primaryContainer.innerHTML = `<div class="p-4 bg-white dark:bg-gray-800 rounded-xl text-red-500 text-xs">Fehler beim Laden der Daten: ${err.message}</div>`;
    timeBadge.textContent = "ERR";
  }
}

function renderAlerts(xmlText) {
  const primaryContainer = document.getElementById('primary-alerts');
  const foodContainer = document.getElementById('food-alerts-container');
  const foodSection = document.getElementById('food-section');
  const foodLabel = document.getElementById('food-accordion-label');
  const parser = new DOMParser();
  const xmlDoc = parser.parseFromString(xmlText, "text/xml");
  const infos = xmlDoc.getElementsByTagName("info");
  
  if (infos.length === 0) {
    primaryContainer.innerHTML = "<div class='p-4 bg-white dark:bg-gray-800 rounded-xl text-gray-500 text-xs'>Aktuell liegen keine aktiven Warnungen vor.</div>";
    foodSection.style.display = "none";
    return;
  }
  
  let alertsList = [];
  let localeSetting = currentLang === 'de' ? 'de-DE' : currentLang === 'fr' ? 'fr-FR' : 'en-US';
  
  for (let info of infos) {
    const lang = info.getElementsByTagName("language")[0]?.textContent || "";
    if (!lang.toLowerCase().startsWith(currentLang)) continue;
    
    const category = info.getElementsByTagName("category")[0]?.textContent || "";
    let isFoodRecall = category.toLowerCase() === "health";
    const eventCodes = info.getElementsByTagName("eventCode");
    for (let code of eventCodes) {
      if (code.getElementsByTagName("value")[0]?.textContent === "FOOD_RECALL") {
        isFoodRecall = true;
        break;
      }
    }
    
    let levelCodeRaw = "N3";
    const parameters = info.getElementsByTagName("parameter");
    for (let param of parameters) {
      const valName = param.getElementsByTagName("valueName")[0]?.textContent || "";
      const val = param.getElementsByTagName("value")[0]?.textContent || "";
      if (valName.includes("cb-eu-level")) {
        if (val === "ALERT_LVL_1") levelCodeRaw = "N1";
        else if (val === "ALERT_LVL_2") levelCodeRaw = "N2";
        else if (val === "ALERT_LVL_3") levelCodeRaw = "N3";
      }
    }
    
    let displayLevel = levelCodeRaw;
    if (levelCodeRaw.startsWith("N")) {
      if (currentLang === 'de') displayLevel = levelCodeRaw.replace("N", "S");
      if (currentLang === 'en') displayLevel = levelCodeRaw.replace("N", "L");
    }
    
    const headline = info.getElementsByTagName("headline")[0]?.textContent || "Warnmeldung";
    const description = info.getElementsByTagName("description")[0]?.textContent || "";
    const effective = info.getElementsByTagName("effective")[0]?.textContent || "";
    const expires = info.getElementsByTagName("expires")[0]?.textContent || "";
    const sender = xmlDoc.getElementsByTagName("sender")[0]?.textContent || "LU-Alert";
    
    let effectiveDate = new Date(effective);
    let effectiveTime = isNaN(effectiveDate.getTime()) ? 0 : effectiveDate.getTime();
    
    let effectiveStr = effective;
    try {
      effectiveStr = effectiveDate.toLocaleString(localeSetting, { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch(e) {}
    
    let expiresStr = expires;
    try {
      expiresStr = new Date(expires).toLocaleString(localeSetting, { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch(e) {}
    
    const labelValid = currentLang === 'de' ? 'Gültig' : currentLang === 'fr' ? 'Valable' : 'Valid';
    const labelUntil = currentLang === 'de' ? 'bis' : currentLang === 'fr' ? 'au' : 'until';
    const labelSource = currentLang === 'de' ? 'Quelle' : currentLang === 'fr' ? 'Source' : 'Source';
    const levelLabel = currentLang === 'de' ? 'Stufe' : currentLang === 'fr' ? 'Niveau' : 'Level';
    
    let borderColor = 'border-l-yellow-600';
    let badgeColor = 'bg-yellow-600';
    if (levelCodeRaw === 'N1') { borderColor = 'border-l-red-600'; badgeColor = 'bg-red-600'; }
    else if (levelCodeRaw === 'N2') { borderColor = 'border-l-orange-600'; badgeColor = 'bg-orange-600'; }
    else if (levelCodeRaw === 'D') { borderColor = 'border-l-purple-600'; badgeColor = 'bg-purple-600'; }
    else if (levelCodeRaw === 'A') { borderColor = 'border-l-orange-500'; badgeColor = 'bg-orange-500'; }
    else if (levelCodeRaw === 'I') { borderColor = 'border-l-lime-600'; badgeColor = 'bg-lime-600'; }
    else if (levelCodeRaw === 'T') { borderColor = 'border-l-gray-600'; badgeColor = 'bg-gray-600'; }

    const cardHtml = `
      <article class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-5 shadow-sm border-l-4 ${borderColor} space-y-3">
        <div class="flex flex-wrap items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
          <span class="px-2 py-0.5 rounded font-bold text-white ${badgeColor}">${levelLabel}: ${displayLevel}</span>
          <span class="bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded">${labelValid}: ${effectiveStr} ${labelUntil} ${expiresStr}</span>
          <span class="bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded">${labelSource}: ${sender}</span>
        </div>
        <div class="text-base font-bold text-gray-900 dark:text-white">${headline}</div>
        <div class="text-sm text-gray-700 dark:text-gray-300 leading-relaxed space-y-2">${description}</div>
      </article>`;
      
    alertsList.push({
      isFoodRecall,
      effectiveTime,
      cardHtml
    });
  }

  // Neueste Meldung zuerst (absteigend sortieren)
  alertsList.sort((a, b) => b.effectiveTime - a.effectiveTime);

  let primaryCardsHtml = "";
  let foodCardsHtml = "";
  let foodCount = 0;

  for (let item of alertsList) {
    if (item.isFoodRecall) {
      foodCardsHtml += item.cardHtml;
      foodCount++;
    } else {
      primaryCardsHtml += item.cardHtml;
    }
  }

  const noEmergencyText = currentLang === 'de' ? 'Keine akuten Notfall- oder Unwetterwarnungen.' : currentLang === 'fr' ? 'Aucune alerte d\'urgence ou météo active.' : 'No active emergency or weather alerts.';
  
  if (primaryCardsHtml !== "") {
    primaryContainer.innerHTML = primaryCardsHtml;
  } else {
    primaryContainer.innerHTML = `<div class="p-4 bg-white dark:bg-gray-800 rounded-xl text-gray-500 text-xs">${noEmergencyText}</div>`;
  }
  
  if (foodCount > 0) {
    const foodTitle = currentLang === 'de' ? `Lebensmittel- & Produktrückrufe (${foodCount})` : currentLang === 'fr' ? `Rappels d'aliments et produits (${foodCount})` : `Food & Product Recalls (${foodCount})`;
    foodSection.style.display = "block";
    foodLabel.textContent = foodTitle;
    foodContainer.innerHTML = foodCardsHtml;
  } else {
    foodSection.style.display = "none";
  }
  
  lucide.createIcons();
}
</script>
